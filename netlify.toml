[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: every path must fall back to index.html, otherwise reloading
# a deep link 404s. The app's own state lives in the query string, so this
# mainly guards against a stray path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed assets never change under the same name — cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must NOT be cached, or the app can never ship an update.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
